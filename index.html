<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- link css -->
        <link rel="stylesheet" href="./style.css" />

        <!-- tailwind link -->
        <script src="https://cdn.tailwindcss.com"></script>

        <title>Keke Cruise</title>
    </head>
    <body>
        <div>
            <!-- navbar -->
            <nav class="w-full h-[80px] px-[42px] flex items-center">
                <div class="w-full flex items-center">
                    <!-- logo -->
                    <div class="flex items-center">
                        <span>
                            <img
                                src="./images/Logo/Logo.png"
                                alt="KekeCruise"
                                class="w-[140px] h-auto"
                            />
                        </span>
                    </div>

                    <!-- ul -->
                    <div class="ml-auto mr-[45px]">
                        <ul class="flex list-none items-center gap-[42px]">
                            <li>
                                <a
                                    href="#"
                                    class="text-[15px] font-medium text-black hover:text-[#FFAA00]"
                                >
                                    Home
                                </a>
                            </li>

                            <li>
                                <a
                                    href="#"
                                    class="text-[15px] font-medium text-black hover:text-[#FFAA00] transition duration-300"
                                >
                                    About Us
                                </a>
                            </li>

                            <li>
                                <a
                                    href="#"
                                    class="text-[15px] font-medium text-black hover:text-[#FFAA00] transition duration-300"
                                >
                                    Our Service
                                </a>
                            </li>

                            <li>
                                <a
                                    href="#"
                                    class="text-[15px] font-medium text-black hover:text-[#FFAA00] transition duration-300"
                                >
                                    How it Works
                                </a>
                            </li>
                        </ul>
                    </div>

                    <!-- button -->
                    <div>
                        <button
                            class="px-[28px] py-[12px] bg-[#FFAA00] rounded-full text-[15px] font-medium text-black whitespace-nowrap hover:bg-black hover:text-white transition duration-300"
                        >
                            Join Our Community
                        </button>
                    </div>
                </div>
            </nav>

            <!-- Hero section  -->

            <!-- one section -->
            <section
                class="container flex justify-between items-center h-full mx-auto py-16 bg-[#F5F5F5]"
            >
                <!-- left -->
                <div class="w-[619px] shrink-0 items-center flex-row gap-y-9">
                    <!-- text h2 -->
                    <h2
                        class="text-6xl font-bold leading-[130%] tracking-[0.1px]"
                    >
                        FAST, AFFORDABLE, AND ECO-FRIENDLY DELIVERIES
                    </h2>

                    <!-- text p -->
                    <p class="uppercase leading-[130%] tracking-[0.1px] pt-3">
                        We deliver your needs swiftly while keeping the
                        environment green.
                    </p>

                    <!-- two buttons -->
                    <div class="flex gap-4 pt-12">
                        <div
                            class="px-[28px] py-[12px] bg-[#FFAA00] rounded-full text-[15px] font-medium text-black whitespace-nowrap hover:bg-black hover:text-white transition duration-300"
                        >
                            Join Our Community
                        </div>
                        <div
                            class="px-[28px] py-[12px] border border-black rounded-full font-medium hover:bg-[#FFAA00] hover:border-transparent whitespace-nowrap transition duration-300"
                        >
                            Learn More
                        </div>
                    </div>
                </div>

                <!-- right -->
                <div class="relative h-[420px] w-full max-w-[650px]">
                    <!-- LEFT CARD -->
                    <div
                        class="absolute left-4 top-14 z-10 h-[300px] w-[220px] -rotate-[12deg] overflow-hidden rounded-xl border-2 border-[#f5a900] bg-white shadow-md transition-transform duration-300 hover:-rotate-[15deg]"
                    >
                        <img
                            src="./images/One section three images/left card.jpg"
                            alt=""
                            class="h-full w-full object-cover"
                        />
                    </div>

                    <!-- CENTER CARD -->
                    <div
                        class="absolute left-1/2 top-0 z-30 h-[350px] w-[280px] -translate-x-1/2 overflow-hidden rounded-xl border-2 border-[#f5a900] bg-white shadow-xl transition-transform duration-300 hover:scale-[1.02]"
                    >
                        <img
                            src="./images/One section three images/center card.jpg"
                            alt=""
                            class="h-full w-full object-cover"
                        />
                    </div>

                    <!-- RIGHT CARD -->
                    <div
                        class="absolute right-4 top-14 z-10 h-[300px] w-[220px] rotate-[12deg] overflow-hidden rounded-xl border-2 border-[#f5a900] bg-white shadow-md transition-transform duration-300 hover:rotate-[15deg] items-center"
                    >
                        <img
                            src="./images/One section three images/rigt card.jpg"
                            alt=""
                            class="h-full w-full object-cover"
                        />
                    </div>
                </div>
            </section>

            <!-- Newsletter Section -->
            <div
                class="flex mx-auto items-center justify-between gap-6 bg-[#FFAA00] rounded-2xl border-2 border-dashed border-black/10 px-6 py-8 mx-6"
            >
                <!-- left text -->
                <div
                    class="text-2xl w-[314px] shrink-0 font-bold leading-[130%] text-black"
                >
                    Be Part Of The Future Of Eco-Friendly Deliveries!
                </div>

                <!-- email input -->
                <div class="flex-1">
                    <input
                        type="email"
                        placeholder="Enter your Email Address"
                        class="w-full h-[70px] rounded-full bg-white px-6 text-gray-500 placeholder-gray-400 outline-none focus:ring-2 focus:ring-black/20"
                    />
                </div>

                <!-- button -->
                <button
                    class="shrink-0 whitespace-nowrap rounded-full bg-black px-8 py-4 text-[15px] font-medium text-white transition duration-300 hover:bg-white hover:text-black"
                >
                    Join Our Waitlist
                </button>
            </div>
        </div>
    </body>
</html>
